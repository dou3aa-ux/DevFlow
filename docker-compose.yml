
services:
  postgres:
    image: postgres:16
    container_name: devflow-postgres
    restart: always
    environment:
      POSTGRES_DB: devflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
    - "5678:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: